# 本地开发数据库（第一阶段：数据库基座，见 CLAUDE.md）
# 凭据不入库：复制 .env.example 为 .env.local 填好后再 `docker compose up -d`
services:
  db:
    image: postgres:17
    container_name: meta-creative-db
    env_file:
      - .env.local
    ports:
      - "5432:5432"
    volumes:
      # 命名卷（Docker Desktop 虚拟盘内），不 bind-mount 到 /mnt/c——慢盘与 9p 权限问题
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
