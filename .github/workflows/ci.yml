name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-check:
    name: Build and deployment smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node 24
        with:
          persist-credentials: false

      - name: Create isolated configuration without API keys
        run: python3 scripts/init-local.py

      - name: Validate deployment configuration
        run: |
          bash -n scripts/deploy.sh
          bash scripts/deploy.sh .deploy/local.env check
          SITE_ADDRESS=example.com bash scripts/deploy.sh .deploy/local.env check --https
          docker run --rm -e SITE_ADDRESS=example.com \
            --mount "type=bind,source=$PWD/Caddyfile,target=/etc/caddy/Caddyfile,readonly" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          python3 scripts/init-staging.py "meta-creative-tool:sha-${GITHUB_SHA}"
          python3 scripts/init-staging-auth.py
          bash -n scripts/staging.sh
          bash scripts/staging.sh check
          SITE_ADDRESS=example.com docker compose --env-file .deploy/local.env -f compose.deploy.yml -f compose.https.yml -f compose.staging-edge.yml config -q

      - name: Build application and frontend from source
        run: bash scripts/deploy.sh .deploy/local.env build

      - name: Initialize database and verify migration is repeatable
        run: |
          bash scripts/deploy.sh .deploy/local.env db
          bash scripts/deploy.sh .deploy/local.env migrate
          bash scripts/deploy.sh .deploy/local.env migrate

      - name: Start and verify application
        run: |
          bash scripts/deploy.sh .deploy/local.env start
          bash scripts/deploy.sh .deploy/local.env smoke
          python3 -m unittest discover -s tests -p 'test_deployment.py' -v

      - name: Verify staging isolation and shared proxy
        run: |
          docker tag meta-creative-tool:local "meta-creative-tool:sha-${GITHUB_SHA}"
          bash scripts/staging.sh db
          bash scripts/staging.sh migrate
          bash scripts/staging.sh start
          TEST_BASE_URL=http://127.0.0.1:18001 python3 -m unittest discover -s tests -p 'test_deployment.py' -v
          python3 tests/check_environment_isolation.py
          cp Caddyfile .deploy/Caddyfile.shared-check
          printf '\nimport /etc/caddy/sites/*.caddy\n' >> .deploy/Caddyfile.shared-check
          docker run --rm -e SITE_ADDRESS=example.com \
            --mount "type=bind,source=$PWD/.deploy/Caddyfile.shared-check,target=/etc/caddy/Caddyfile,readonly" \
            --mount "type=bind,source=$PWD/deploy/staging.caddy,target=/etc/caddy/sites/staging.caddy,readonly" \
            --mount "type=bind,source=$PWD/.deploy/staging-auth.caddy,target=/etc/caddy/private/staging-auth.caddy,readonly" \
            caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run -d --name ci-staging-proxy --network meta-creative-staging_edge \
            -p 127.0.0.1:18081:8080 caddy:2 caddy reverse-proxy --from :8080 --to staging-app:8000
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 --max-time 5 http://127.0.0.1:18081/api/health
          python3 tests/check_staging_access.py

      - name: Package the tested image without rebuilding
        run: |
          mkdir -p .deploy/artifact
          docker save "meta-creative-tool:sha-${GITHUB_SHA}" | gzip > .deploy/artifact/application-image.tar.gz
          printf '%s\n' "$GITHUB_SHA" > .deploy/artifact/SOURCE_COMMIT
          docker image inspect --format '{{.Id}}' "meta-creative-tool:sha-${GITHUB_SHA}" > .deploy/artifact/IMAGE_ID
          tar -czf .deploy/artifact/staging-config.tar.gz compose.staging.yml compose.staging-edge.yml deploy/staging.caddy scripts/init-staging.py scripts/init-staging-auth.py scripts/staging.sh
          cd .deploy/artifact
          sha256sum application-image.tar.gz staging-config.tar.gz SOURCE_COMMIT IMAGE_ID > SHA256SUMS

      - name: Upload tested deployment artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: deployment-${{ github.sha }}
          path: .deploy/artifact/*
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Show diagnostics on failure
        if: failure()
        run: |
          bash scripts/deploy.sh .deploy/local.env status
          bash scripts/deploy.sh .deploy/local.env logs
          bash scripts/staging.sh logs

      - name: Remove temporary CI containers and data
        if: always()
        run: |
          docker rm -f ci-staging-proxy || true
          docker compose -p meta-creative-staging --env-file .deploy/staging.env -f compose.staging.yml down -v --remove-orphans
          docker compose --env-file .deploy/local.env -f compose.deploy.yml down -v --remove-orphans
